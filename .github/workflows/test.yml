name: Test

on:
  pull_request:
  push:
    branches:
      - automation/bors/try
      - automation/bors/try-perf
      - automation/bors/auto

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - run: exit 0
  ec2-job:
    runs-on: ec2-gha-c8a.medium-x64-linux
    if: ${{ github.ref == 'refs/heads/automation/bors/try' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - run: ls -la .
      - run: uname -a
  ec2-aarch64-job:
    runs-on: ec2-gha_arm64-t4g.micro-aarch64-linux
    if: ${{ github.ref == 'refs/heads/automation/bors/try' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - run: ls -la .
      - run: uname -a
  sleep-60:
    needs: [ init ]
    runs-on: ubuntu-latest
    steps:
      - run: sleep 60
  dynamic:
    needs: [ init ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - if: ${{ github.event_name == 'pull_request' }}
        run: |
          commit_msg=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq '.body')
          if [[ $commit_msg == *"fail"* ]]; then
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: ${{ github.event_name == 'push' }}
        run: |
          commit_msg="${{ github.event.head_commit.message }}"
          if [[ $commit_msg == *"fail"* ]]; then
            exit 1
          fi
